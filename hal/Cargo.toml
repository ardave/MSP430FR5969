[package]
name = "msp430fr5969-hal"
version = "0.2.0"
edition = "2021"
description = "Hardware abstraction layer (embedded-hal) for the TI MSP430FR5969 microcontroller"
repository = "https://github.com/ardave/MSP430FR5969"
documentation = "https://docs.rs/msp430fr5969-hal"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["msp430", "hal", "embedded-hal", "no-std", "ti"]
categories = ["embedded", "hardware-support", "no-std"]

# docs.rs builds on x86_64 Linux by default; document for the real target with
# the feature-gated items (rt, critical-section) included. The tier-3 target
# has no prebuilt core, hence build-std (docs.rs builds on nightly).
[package.metadata.docs.rs]
default-target = "msp430-none-elf"
features = ["rt", "critical-section"]
cargo-args = ["-Z", "build-std=core"]

[features]
rt = ["pac/rt"]
critical-section = ["pac/critical-section", "dep:critical-section"]

[dependencies]
pac = { package = "msp430fr5969", version = "0.2.0" }
# Interrupt-enable/flag registers are shared (PxIE, UCAxIE, SFRIE1), so the
# HAL's enable/disable paths RMW them inside critical_section::with. Optional:
# only pulled in with the `critical-section` feature, alongside the PAC's
# Peripherals::take() gating on the same impl.
critical-section = { version = "1", optional = true }
embedded-hal = "1.0"
# Non-blocking serial traits (serial::Read / serial::Write) — the embedded-hal
# project's UART abstraction. Re-exports the `nb` crate it builds on.
embedded-hal-nb = "1.0"
# Blocking, byte-stream I/O traits (Read / Write / ReadReady / WriteReady).
embedded-io = "0.6"
# Byte-addressable non-volatile storage traits (ReadStorage / Storage). The
# embedded-hal ecosystem's abstraction for EEPROM/FRAM/flash; used by `fram`.
embedded-storage = "0.3"

# Only the examples need these: the critical-section single-core impl that
# Peripherals::take() requires, the #[entry]/#[interrupt] runtime macros, and
# the Mutex front-end for ISR↔main shared state.
[dev-dependencies]
msp430 = { version = "0.4.1", features = ["critical-section-single-core"] }
msp430-rt = "0.4.1"
critical-section = "1"

# Getting-started examples (examples/*.rs) — each is a complete flashable
# firmware, so each needs the runtime (`rt`) and the critical-section impl:
#
#   cargo +nightly build --examples --features rt,critical-section
[[example]]
name = "blink"
required-features = ["rt", "critical-section"]

[[example]]
name = "uart_hello"
required-features = ["rt", "critical-section"]

[[example]]
name = "temperature"
required-features = ["rt", "critical-section"]

[[example]]
name = "button_wake"
required-features = ["rt", "critical-section"]

[[example]]
name = "pwm_fade"
required-features = ["rt", "critical-section"]
