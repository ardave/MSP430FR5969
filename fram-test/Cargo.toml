# Standalone host-target test for the FRAM addressing / bounds math.
#
# Detached from the main workspace (note the empty [workspace] table) and given
# its own .cargo/config.toml so it builds for the host instead of inheriting the
# repo's msp430-none-elf target. It `include!`s the REAL hal/src/fram_addr.rs
# source, so an incorrect edit to the bounds arithmetic or a region size/base
# constant fails these tests.
#
# Run with:  cd fram-test && cargo test
[package]
name = "fram-test"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
path = "src/lib.rs"
