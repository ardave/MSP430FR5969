# Host-side runner for the on-board HAL integration (hardware-in-the-loop) tests.
#
# Detached from the main workspace (note the empty [workspace] table) and given
# its own .cargo/config.toml so it builds and runs on the host (aarch64 macOS)
# instead of inheriting the repo's msp430-none-elf / build-std=["core"] target.
# This crate runs on the development workstation and talks to the flashed board
# over UART — it is NOT cross-compiled to the MSP430.
#
# Run with:  cd single_board_test_orchestrators && cargo test   (or `cargo run`)
[package]
name = "single_board_test_orchestrators"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
# Host-side serial port access for talking to the board's eUSCI_A0 UART
# backchannel over the eZ-FET USB CDC port.
serialport = "4"
# Ergonomic shelling-out for the build/flash plumbing in deployment.rs: the
# `cmd!` macro interpolates safely and returns Err on non-zero exit.
xshell = "0.2"
