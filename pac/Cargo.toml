[package]
name = "msp430fr5969"
version = "0.2.0"
edition = "2021"
description = "Peripheral access crate for the TI MSP430FR5969 microcontroller"
repository = "https://github.com/ardave/MSP430FR5969"
documentation = "https://docs.rs/msp430fr5969"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["msp430", "svd2rust", "no-std", "ti", "microcontroller"]
categories = ["embedded", "hardware-support", "no-std"]

# docs.rs builds on x86_64 Linux by default; document for the real target with
# the rt-gated items (vector table, interrupt re-exports) included. The tier-3
# target has no prebuilt core, hence build-std (docs.rs builds on nightly).
[package.metadata.docs.rs]
default-target = "msp430-none-elf"
features = ["rt", "critical-section"]
cargo-args = ["-Z", "build-std=core"]

[features]
# Enabling `rt` pulls in msp430-rt (the reset handler, RAM init, vector-table
# glue and the #[entry]/#[interrupt] macros) and turns on its `device` feature
# so the macros validate against this PAC's `Interrupt` enum. The slash-syntax
# also enables the optional msp430-rt dependency.
rt = ["msp430-rt/device"]
critical-section = ["dep:critical-section"]

[dependencies]
vcell = "0.1"
critical-section = { version = "1", optional = true }
msp430-rt = { version = "0.4.1", optional = true }
