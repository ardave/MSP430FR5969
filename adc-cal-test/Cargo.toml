# Standalone host-target test for the ADC calibration / scaling math.
#
# Detached from the main workspace (note the empty [workspace] table) and given
# its own .cargo/config.toml so it builds for the host instead of inheriting the
# repo's msp430-none-elf target. It `include!`s the REAL hal/src/adc_cal.rs
# source, so an incorrect edit to the temperature interpolation or the
# fixed-point corrections fails these tests.
#
# Run with:  cd adc-cal-test && cargo test
[package]
name = "adc-cal-test"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
path = "src/lib.rs"
