name: CI
#
# Continuous-integration build for the MSP430FR5969 PAC + HAL workspace.
#
# WHAT THIS WORKFLOW DOES
#   - firmware job  : compiles the workspace for the `msp430-none-elf` target.
#                     The PAC (`msp430fr5969`) and `hal` library crates are fully
#                     built (rlibs, real codegen); the whole workspace --
#                     including the consumer binaries -- and the hal examples are
#                     type-checked with `cargo check`.
#   - link job      : downloads TI's MSP430-GCC for Linux (sha256-pinned,
#                     cached) and LINKS the entire workspace plus the hal
#                     examples into real ELFs. This is what catches link-only
#                     failures: FRAM overflow (48 KB), missing runtime symbols,
#                     multilib/ISA mismatches.
#   - package job   : `cargo package`s both publishable crates (pac, hal) so a
#                     file missing from a published crate (memory.x, device.x,
#                     build.rs) fails the PR instead of release day.
#   - unit-tests job: runs the host-side unit tests in `unit_tests/` (the HAL's
#                     pure math -- baud, ticks, FRAM addressing, ADC calibration,
#                     CRC model, and friends).
#
# WHAT IT DOES NOT DO
#   - It does NOT flash or run anything on hardware (no device in CI); the
#     hardware-in-the-loop suite in `hal_integration_tests/` stays a local,
#     board-attached workflow.
#   - It does NOT run lint/format checks (rustfmt/clippy) -- compilation only.

# Compile on every PR targeting main, and on every push (merge or direct
# commit) to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch/PR cancels an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Compile the firmware for the msp430-none-elf target (no TI toolchain: the
  # library crates fully build as rlibs, the binaries and examples are
  # `cargo check`ed). Fast feedback; the `link` job below does the real link.
  # ---------------------------------------------------------------------------
  firmware:
    name: Firmware (msp430-none-elf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `-Z build-std=core` (set in .cargo/config.toml) compiles `core` from
      # source for the tier-3 msp430 target, so the nightly toolchain needs the
      # `rust-src` component. No `rustup target add` is required.
      - name: Install nightly Rust + rust-src
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2

      # The library packages carry their crates.io names (`msp430fr5969`,
      # `msp430fr5969-hal`) even though they live in the `pac/` and `hal/`
      # directories -- `-p` matches package names, not paths.
      - name: Build libraries (msp430fr5969, msp430fr5969-hal)
        run: cargo build -p msp430fr5969 -p msp430fr5969-hal

      - name: Check entire workspace (incl. consumer binaries)
        run: cargo check --workspace

      # The getting-started examples are complete firmwares and carry
      # `required-features = ["rt", "critical-section"]`.
      - name: Check hal examples
        run: cargo check -p msp430fr5969-hal --examples --features rt,critical-section

  # ---------------------------------------------------------------------------
  # Link every binary in the workspace (and the hal examples) into flashable
  # ELFs with TI's MSP430-GCC. This is the only job that catches link-only
  # failures -- most importantly the FRAM budget: the part has 48 KB, and a
  # change that drags in `core::fmt` (~30 KB) only fails at link time.
  #
  # The toolchain is TI's free MSP430-GCC-OPENSOURCE Linux tarball,
  # sha256-pinned and cached between runs (~64 MB download on a cache miss).
  # `.cargo/config.toml` points the linker at tools/msp430-linker.sh, which
  # honors $MSP430_GCC -- set below. The toolchain-only tarball is enough:
  # gcc 9.3 resolves `-mmcu=msp430fr5969` from built-in device data (verified
  # against the macOS install, which has no devices.csv either) and the link
  # uses msp430-rt's link.x, not TI's device linker scripts.
  # ---------------------------------------------------------------------------
  link:
    name: Link firmware ELFs (TI MSP430-GCC)
    runs-on: ubuntu-latest
    env:
      TI_GCC_VERSION: 9.3.1.11
      TI_GCC_URL: https://dr-download.ti.com/software-development/ide-configuration-compiler-or-debugger/MD-LlCjWuAbzH/9.3.1.2/msp430-gcc-9.3.1.11_linux64.tar.bz2
      TI_GCC_SHA256: b60851b61565e3ddd2193298a3fac5120c2402597174106cc5f8482b9e9986e6
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly Rust + rust-src
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Cache TI MSP430-GCC
        id: ti-gcc-cache
        uses: actions/cache@v4
        with:
          path: ~/ti-gcc
          key: ti-msp430-gcc-${{ env.TI_GCC_VERSION }}-linux64

      - name: Download TI MSP430-GCC
        if: steps.ti-gcc-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSL --retry 3 -o /tmp/msp430-gcc.tar.bz2 "$TI_GCC_URL"
          echo "$TI_GCC_SHA256  /tmp/msp430-gcc.tar.bz2" | sha256sum -c -
          mkdir -p ~/ti-gcc
          tar xjf /tmp/msp430-gcc.tar.bz2 -C ~/ti-gcc

      - name: Point the linker wrapper at the toolchain
        run: echo "MSP430_GCC=$HOME/ti-gcc/msp430-gcc-${TI_GCC_VERSION}_linux64/bin/msp430-elf-gcc" >> "$GITHUB_ENV"

      - name: Link entire workspace
        run: cargo build --workspace

      - name: Link hal examples
        run: cargo build -p msp430fr5969-hal --examples --features rt,critical-section

  # ---------------------------------------------------------------------------
  # Dry-run packaging of the two publishable crates. `--list` output is checked
  # for the files the build machinery depends on at consumer sites: the PAC's
  # build.rs copies memory.x/device.x to the linker search path, so a package
  # missing them produces a crate that cannot link downstream.
  # `--no-verify` skips the verify build (the `link` job already proves the
  # sources compile; the verify build would need the TI linker for no gain).
  # ---------------------------------------------------------------------------
  package:
    name: Package check (crates.io)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly Rust + rust-src
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Package msp430fr5969 (pac)
        run: |
          cargo package -p msp430fr5969 --no-verify --list | tee /tmp/pac-files
          grep -qx 'memory.x' /tmp/pac-files
          grep -qx 'device.x' /tmp/pac-files
          grep -qx 'build.rs' /tmp/pac-files
          cargo package -p msp430fr5969 --no-verify

      - name: Package msp430fr5969-hal
        run: |
          cargo package -p msp430fr5969-hal --no-verify --list | tee /tmp/hal-files
          grep -qx 'README.md' /tmp/hal-files
          cargo package -p msp430fr5969-hal --no-verify

  # ---------------------------------------------------------------------------
  # Host-side unit tests for the HAL's pure math (one module per subject, each
  # `include!`ing the real shipping source from `hal/src/`).
  #
  # `unit_tests/` is detached from the workspace and pins its host triple to
  # `aarch64-apple-darwin` (see unit_tests/.cargo/config.toml), so it runs on an
  # Apple-Silicon macOS runner -- `macos-latest` is arm64 -- where that triple
  # matches the host and the crate builds as documented. It also relies on
  # `-Z build-std`, hence nightly + rust-src here too.
  # ---------------------------------------------------------------------------
  unit-tests:
    name: HAL pure-math (host tests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly Rust + rust-src
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: unit_tests

      - name: Run host unit tests
        working-directory: unit_tests
        run: cargo test
