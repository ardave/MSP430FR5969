[package]
name = "hal_test_runners"
version = "0.1.0"
edition = "2024"

[features]
# Build the `serial_uart` integration fixture at 115200 baud instead of the
# default 9600. Selects a compile-time baud constant + confirmation line in
# src/bin/serial_uart.rs, so one source covers both rates (no second binary).
baud_115200 = []

[dependencies]
hal = { path = "../hal", features = ["rt", "critical-section"] }
# Third-party embedded-hal 1.0 driver for the BME280, used by the bme280_env
# binary. Driving a real ecosystem crate through hal::i2c::I2c is the strongest
# validation that our embedded_hal::i2c::I2c impl is correct and interoperable.
bme280 = "0.5"
msp430 = { version = "0.4.1", features = ["critical-section-single-core"] }
# Shared state between the TIMER0_A1 ISR and main lives in a critical-section
# Mutex. msp430 (above) provides the single-core impl; this is the front-end API
# (Mutex / with). The #[interrupt] macro hands the ISR a CriticalSection token.
critical-section = "1"
# Provides the #[entry] attribute and the Reset/runtime that replaces the
# hand-rolled _start. hal's `rt` feature also enables this transitively, but we
# name it directly to `use msp430_rt::entry`.
msp430-rt = "0.4.1"
